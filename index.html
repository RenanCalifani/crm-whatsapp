<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CRM WhatsApp</title>
<style>
  :root {
    --verde: #075e54;
    --verde-wa: #25d366;
    --fundo: #eef1f4;
    --card: #fff;
    --texto: #1f2933;
    --suave: #6b7785;
    --borda: #dde3e9;
    --raio: 12px;
    --col-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo); color: var(--texto);
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Login ---------- */
  #login {
    min-height: 100%; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(160deg, var(--verde), #128c7e);
  }
  #login form {
    width: 100%; max-width: 340px; background: #fff; border-radius: 16px;
    padding: 28px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  #login h1 { margin: 0 0 4px; font-size: 1.4rem; }
  #login p { margin: 0 0 18px; color: var(--suave); }
  .erro { color: #c62828; font-size: .9rem; min-height: 1.2em; margin: 8px 0 0; }

  input, textarea {
    width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 10px;
    background: #fff; color: var(--texto); font-size: 16px; /* 16px evita zoom automático no iPhone */
  }
  input:focus, textarea:focus { outline: 2px solid var(--verde-wa); border-color: transparent; }
  .btn {
    border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 600;
    background: var(--verde); color: #fff; min-height: 44px;
  }
  .btn.sec { background: #e6eaee; color: var(--texto); }
  .btn.perigo { background: transparent; color: #c62828; }
  .btn:disabled { opacity: .6; }
  .largo { width: 100%; margin-top: 12px; }

  /* ---------- App ---------- */
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    background: var(--verde); color: #fff; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  header .resumo { font-size: .8rem; opacity: .85; }
  .icone {
    background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 8px;
    padding: 8px 10px; font-size: .85rem;
  }

  /* Abas (só no celular) */
  nav#abas {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: #fff;
    border-bottom: 1px solid var(--borda); scrollbar-width: none;
  }
  nav#abas::-webkit-scrollbar { display: none; }
  nav#abas button {
    flex: none; border: 1px solid var(--borda); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: .85rem; white-space: nowrap;
  }
  nav#abas button.ativa { background: var(--texto); color: #fff; border-color: var(--texto); }
  nav#abas .n { opacity: .7; margin-left: 4px; }

  #quadro {
    flex: 1; display: flex; gap: 12px; padding: 12px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .coluna {
    flex: none; width: var(--col-w); display: flex; flex-direction: column;
    background: #e3e8ed; border-radius: var(--raio); max-height: 100%;
    scroll-snap-align: center; border-top: 4px solid var(--cor);
  }
  .coluna-topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .coluna-topo h2 { font-size: .95rem; margin: 0; flex: 1; }
  .coluna-topo .cont {
    background: rgba(0,0,0,.08); border-radius: 999px; padding: 1px 8px; font-size: .8rem;
  }
  .coluna-topo .add {
    border: 0; background: transparent; font-size: 1.4rem; line-height: 1; padding: 2px 8px;
    color: var(--suave); border-radius: 6px;
  }
  .total { padding: 0 12px 8px; font-size: .8rem; color: var(--suave); }
  .lista {
    flex: 1; overflow-y: auto; padding: 0 8px 80px; min-height: 80px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .vazio { text-align: center; color: var(--suave); font-size: .85rem; padding: 18px 8px; }

  .card {
    background: var(--card); border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .card .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .nome { font-weight: 600; word-break: break-word; }
  .card .valor { font-size: .85rem; color: var(--verde); font-weight: 600; white-space: nowrap; }
  .card .l2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .card .tel { font-size: .85rem; color: var(--suave); flex: 1; }
  .card .nota {
    margin-top: 6px; font-size: .85rem; color: #45505c; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .wa {
    display: inline-flex; align-items: center; gap: 5px; background: var(--verde-wa); color: #fff;
    text-decoration: none; font-size: .8rem; font-weight: 600; border-radius: 999px;
    padding: 6px 11px; min-height: 32px;
  }
  .wa svg { width: 15px; height: 15px; fill: currentColor; }
  .wa.off { background: #c9d1d9; pointer-events: none; }

  .fantasma { opacity: .35; }
  .escolhido { box-shadow: 0 8px 20px rgba(0,0,0,.25); transform: rotate(1.5deg); }

  #fab {
    position: fixed; right: 18px; bottom: max(18px, env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--verde-wa);
    color: #fff; font-size: 2rem; line-height: 1; box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }

  /* ---------- Modal ---------- */
  dialog {
    border: 0; padding: 0; border-radius: 16px; width: min(480px, 100%);
    max-height: 92vh; color: var(--texto);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h3 { margin: 0; }
  label { font-size: .85rem; color: var(--suave); display: flex; flex-direction: column; gap: 4px; }
  textarea { min-height: 110px; resize: vertical; }
  .etapas { display: flex; flex-wrap: wrap; gap: 6px; }
  .etapas label { flex-direction: row; }
  .etapas input { position: absolute; opacity: 0; width: 0; height: 0; }
  .etapas span {
    border: 1px solid var(--borda); border-radius: 999px; padding: 8px 12px; font-size: .85rem;
    color: var(--texto); cursor: pointer;
  }
  .etapas input:checked + span { background: var(--cor); border-color: var(--cor); color: #fff; }
  .etapas input:focus-visible + span { outline: 2px solid var(--verde-wa); }
  .acoes { display: flex; gap: 8px; align-items: center; }
  .acoes .esp { flex: 1; }

  #aviso {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: .9rem;
    z-index: 10; max-width: 90vw;
  }

  /* ---------- Celular ---------- */
  @media (max-width: 760px) {
    :root { --col-w: calc(100vw - 40px); }
    #quadro { gap: 10px; padding: 10px 20px; scroll-padding: 0 20px; }
    dialog {
      margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 16px 16px 0 0;
      max-height: 94vh;
    }
    dialog form { padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    header .resumo { display: none; }
  }
  @media (min-width: 761px) {
    nav#abas { display: none; }
    #quadro { scroll-snap-type: none; }
  }
</style>
</head>
<body>

<!-- Tela de senha -->
<section id="login" hidden>
  <form id="form-login">
    <h1>CRM WhatsApp</h1>
    <p>Digite a senha para entrar</p>
    <input id="senha" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button class="btn largo" type="submit">Entrar</button>
    <p class="erro" id="erro-login"></p>
  </form>
</section>

<!-- App -->
<section id="app" hidden>
  <header>
    <h1>CRM WhatsApp</h1>
    <span class="resumo" id="resumo"></span>
    <button class="icone" id="sair" title="Sair">Sair</button>
  </header>
  <nav id="abas"></nav>
  <main id="quadro"></main>
  <button id="fab" aria-label="Novo contato">+</button>
</section>

<!-- Modal de cadastro/edição -->
<dialog id="modal">
  <form id="form-lead" method="dialog">
    <h3 id="modal-titulo">Novo contato</h3>
    <label>Nome
      <input name="nome" required autocomplete="off" maxlength="120">
    </label>
    <label>Telefone (com DDD)
      <input name="telefone" type="tel" inputmode="tel" placeholder="(11) 98765-4321" autocomplete="off">
    </label>
    <label>Valor estimado (R$)
      <input name="valor" inputmode="decimal" placeholder="0,00" autocomplete="off">
    </label>
    <label>Anotações
      <textarea name="anotacao" placeholder="O que a pessoa quer, combinados, próximos passos…"></textarea>
    </label>
    <div>
      <label style="margin-bottom:6px">Etapa</label>
      <div class="etapas" id="etapas"></div>
    </div>
    <div class="acoes">
      <button type="button" class="btn perigo" id="excluir">Excluir</button>
      <span class="esp"></span>
      <button type="button" class="btn sec" id="cancelar">Cancelar</button>
      <button type="submit" class="btn" id="salvar">Salvar</button>
    </div>
  </form>
</dialog>

<div id="aviso" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
(() => {
  const COLUNAS = [
    { id: "chegou",      nome: "Chegou",            cor: "#64748b" },
    { id: "conversando", nome: "Conversando",       cor: "#0284c7" },
    { id: "orcamento",   nome: "Orçamento enviado", cor: "#d97706" },
    { id: "fechou",      nome: "Fechou",            cor: "#16a34a" },
    { id: "perdeu",      nome: "Perdeu",            cor: "#dc2626" },
  ];

  const $ = (s, el = document) => el.querySelector(s);
  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const ICONE_WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';

  const cfg = window.CONFIG || {};
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes("SEU-PROJETO")) {
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Configure o arquivo <b>config.js</b> com os dados do seu Supabase.</p>';
    return;
  }
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  let leads = [];
  let arrastando = false;
  let editandoId = null;
  let canal = null;

  // ---------- Utilidades ----------
  function aviso(msg) {
    const el = $("#aviso");
    el.textContent = msg; el.hidden = false;
    clearTimeout(aviso.t); aviso.t = setTimeout(() => (el.hidden = true), 3500);
  }

  function numeroWhats(tel) {
    let d = String(tel || "").replace(/\D/g, "");
    if (!d) return "";
    d = d.replace(/^0+/, "");                          // tira 0 de discagem (ex.: 011...)
    if (d.length <= 11) d = (cfg.DDI_PADRAO || "55") + d; // sem DDI: adiciona o padrão
    return d.length >= 12 ? d : "";
  }

  function formatarTel(tel) {
    const d = String(tel || "").replace(/\D/g, "");
    if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
    return tel || "";
  }

  function lerValor(txt) {
    let s = String(txt || "").replace(/[^\d,.-]/g, "");
    if (!s) return 0;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ""); // "1.500" = mil e quinhentos
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
  }

  const valorParaCampo = (v) =>
    Number(v) ? Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "";

  const doStatus = (st) =>
    leads.filter((l) => l.status === st).sort((a, b) => a.posicao - b.posicao);

  // ---------- Montagem do quadro ----------
  function montarQuadro() {
    const quadro = $("#quadro"), abas = $("#abas");
    quadro.innerHTML = ""; abas.innerHTML = "";

    COLUNAS.forEach((c) => {
      const col = document.createElement("section");
      col.className = "coluna"; col.id = "col-" + c.id; col.style.setProperty("--cor", c.cor);
      col.innerHTML = `
        <div class="coluna-topo">
          <h2></h2><span class="cont">0</span>
          <button class="add" title="Adicionar aqui" aria-label="Adicionar em ${c.nome}">+</button>
        </div>
        <div class="total"></div>
        <div class="lista" data-status="${c.id}"></div>`;
      $("h2", col).textContent = c.nome;
      $(".add", col).onclick = () => abrirModal(null, c.id);
      quadro.appendChild(col);

      new Sortable($(".lista", col), {
        group: "leads",
        animation: 150,
        delay: 180,              // no celular: segure o card para arrastar (rolar continua livre)
        delayOnTouchOnly: true,
        touchStartThreshold: 5,
        ghostClass: "fantasma",
        chosenClass: "escolhido",
        filter: ".wa, .vazio",
        preventOnFilter: false,
        scroll: true,
        bubbleScroll: true,
        scrollSensitivity: 60,
        onStart: () => { arrastando = true; },
        onEnd: soltou,
      });

      const aba = document.createElement("button");
      aba.dataset.col = c.id;
      aba.innerHTML = `<span></span><span class="n">0</span>`;
      aba.firstChild.textContent = c.nome;
      aba.onclick = () => col.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      abas.appendChild(aba);
    });

    // Destaca a aba da coluna visível
    const obs = new IntersectionObserver((ents) => {
      ents.forEach((e) => {
        if (e.isIntersecting) {
          const id = e.target.id.replace("col-", "");
          abas.querySelectorAll("button").forEach((b) => b.classList.toggle("ativa", b.dataset.col === id));
        }
      });
    }, { root: quadro, threshold: 0.6 });
    quadro.querySelectorAll(".coluna").forEach((c) => obs.observe(c));
  }

  function criarCard(l) {
    const card = document.createElement("article");
    card.className = "card"; card.dataset.id = l.id;
    const wa = numeroWhats(l.telefone);
    card.innerHTML = `
      <div class="l1"><span class="nome"></span><span class="valor"></span></div>
      <div class="l2">
        <span class="tel"></span>
        <a class="wa ${wa ? "" : "off"}" target="_blank" rel="noopener"
           ${wa ? `href="https://wa.me/${wa}"` : ""}>${ICONE_WA} WhatsApp</a>
      </div>
      <div class="nota"></div>`;
    $(".nome", card).textContent = l.nome;
    $(".valor", card).textContent = Number(l.valor) ? brl.format(l.valor) : "";
    $(".tel", card).textContent = formatarTel(l.telefone) || "sem telefone";
    const nota = $(".nota", card);
    if (l.anotacao) nota.textContent = l.anotacao; else nota.remove();
    $(".wa", card).addEventListener("click", (e) => e.stopPropagation());
    card.addEventListener("click", () => abrirModal(l.id));
    return card;
  }

  function render() {
    let aberto = 0;
    COLUNAS.forEach((c) => {
      const col = $("#col-" + c.id), lista = $(".lista", col);
      const itens = doStatus(c.id);
      const soma = itens.reduce((s, l) => s + Number(l.valor || 0), 0);
      if (c.id !== "fechou" && c.id !== "perdeu") aberto += soma;

      lista.replaceChildren(...itens.map(criarCard));
      if (!itens.length) {
        const v = document.createElement("div");
        v.className = "vazio"; v.textContent = "Nenhum contato";
        lista.appendChild(v);
      }
      $(".cont", col).textContent = itens.length;
      $(".total", col).textContent = soma ? "Total: " + brl.format(soma) : "";
      $(`#abas [data-col="${c.id}"] .n`).textContent = itens.length;
    });
    const fechado = doStatus("fechou").reduce((s, l) => s + Number(l.valor || 0), 0);
    $("#resumo").textContent = `Em negociação: ${brl.format(aberto)} · Fechado: ${brl.format(fechado)}`;
  }

  // ---------- Arrastar e soltar ----------
  async function soltou(evt) {
    arrastando = false;
    const mudancas = [];
    const listas = new Set([evt.from, evt.to]);
    listas.forEach((lista) => {
      const status = lista.dataset.status;
      lista.querySelectorAll(".card").forEach((el, i) => {
        const l = leads.find((x) => x.id === el.dataset.id);
        if (l && (l.status !== status || l.posicao !== i)) {
          l.status = status; l.posicao = i;
          mudancas.push({ id: l.id, status, posicao: i });
        }
      });
    });
    render();
    if (!mudancas.length) return;
    const res = await Promise.all(mudancas.map((m) =>
      sb.from("leads").update({ status: m.status, posicao: m.posicao }).eq("id", m.id)));
    if (res.some((r) => r.error)) { aviso("Não foi possível salvar. Recarregando…"); carregar(); }
  }

  // ---------- Modal ----------
  function montarEtapas() {
    $("#etapas").innerHTML = COLUNAS.map((c) => `
      <label style="--cor:${c.cor}">
        <input type="radio" name="status" value="${c.id}"><span>${c.nome}</span>
      </label>`).join("");
  }

  function abrirModal(id, statusInicial = "chegou") {
    const f = $("#form-lead");
    const l = id ? leads.find((x) => x.id === id) : null;
    editandoId = l ? l.id : null;
    f.reset();
    $("#modal-titulo").textContent = l ? "Editar contato" : "Novo contato";
    $("#excluir").hidden = !l;
    f.nome.value = l?.nome || "";
    f.telefone.value = l ? formatarTel(l.telefone) : "";
    f.valor.value = l ? valorParaCampo(l.valor) : "";
    f.anotacao.value = l?.anotacao || "";
    const st = l?.status || statusInicial;
    f.querySelector(`input[name=status][value="${st}"]`).checked = true;
    $("#modal").showModal();
    if (!l) setTimeout(() => f.nome.focus(), 50);
  }

  async function salvar(e) {
    e.preventDefault();
    const f = e.target, btn = $("#salvar");
    const dados = {
      nome: f.nome.value.trim(),
      telefone: f.telefone.value.trim(),
      valor: lerValor(f.valor.value),
      anotacao: f.anotacao.value.trim(),
      status: f.status.value,
    };
    if (!dados.nome) return f.nome.focus();
    const atual = editandoId ? leads.find((x) => x.id === editandoId) : null;
    if (!atual || atual.status !== dados.status) {
      // entra no topo da coluna
      const col = doStatus(dados.status);
      dados.posicao = col.length ? col[0].posicao - 1 : 0;
    }

    btn.disabled = true;
    const q = atual
      ? sb.from("leads").update(dados).eq("id", atual.id).select().single()
      : sb.from("leads").insert(dados).select().single();
    const { data, error } = await q;
    btn.disabled = false;
    if (error) return aviso("Erro ao salvar: " + error.message);

    const i = leads.findIndex((x) => x.id === data.id);
    if (i >= 0) leads[i] = data; else leads.push(data);
    $("#modal").close();
    render();
  }

  async function excluir() {
    const l = leads.find((x) => x.id === editandoId);
    if (!l || !confirm(`Excluir "${l.nome}"?`)) return;
    const { error } = await sb.from("leads").delete().eq("id", l.id);
    if (error) return aviso("Erro ao excluir: " + error.message);
    leads = leads.filter((x) => x.id !== l.id);
    $("#modal").close();
    render();
  }

  // ---------- Dados ----------
  async function carregar() {
    const { data, error } = await sb.from("leads").select("*").order("posicao");
    if (error) return aviso("Erro ao carregar: " + error.message);
    leads = data;
    if (!arrastando) render();
  }

  let tRecarga;
  function ouvirMudancas() {
    if (canal) return;
    canal = sb.channel("leads-mudancas")
      .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, () => {
        clearTimeout(tRecarga);
        tRecarga = setTimeout(() => { if (!arrastando && !$("#modal").open) carregar(); }, 400);
      })
      .subscribe();
  }

  // ---------- Login ----------
  async function entrar(e) {
    e.preventDefault();
    const btn = e.target.querySelector("button"), erro = $("#erro-login");
    erro.textContent = ""; btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: cfg.LOGIN_EMAIL, password: $("#senha").value });
    btn.disabled = false;
    if (error) { erro.textContent = "Senha incorreta."; $("#senha").select(); }
  }

  function mostrar(logado) {
    $("#login").hidden = logado;
    $("#app").hidden = !logado;
    if (logado) { carregar(); ouvirMudancas(); }
    else { leads = []; if (canal) { sb.removeChannel(canal); canal = null; } $("#senha").value = ""; }
  }

  // ---------- Início ----------
  montarQuadro();
  montarEtapas();
  $("#form-login").addEventListener("submit", entrar);
  $("#form-lead").addEventListener("submit", salvar);
  $("#cancelar").onclick = () => $("#modal").close();
  $("#excluir").onclick = excluir;
  $("#fab").onclick = () => abrirModal(null, "chegou");
  $("#sair").onclick = () => sb.auth.signOut();
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") e.target.close(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#app").hidden) carregar(); });

  let logadoAtual = null;
  sb.auth.onAuthStateChange((_ev, sessao) => {
    const logado = !!sessao;
    // setTimeout: o Supabase recomenda não chamar o client dentro deste callback
    if (logado !== logadoAtual) { logadoAtual = logado; setTimeout(() => mostrar(logado), 0); }
  });
})();
</script>
</body>
</html>
